<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo | Crear cuenta</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-form">

  <!-- Navbar -->
  <header class="navbar">
    <a class="marca" href="index.html">
      <img class="logo" src="img/logo.svg" alt="" width="28" height="28">
      Nodo
    </a>

    <input class="menu-toggle" type="checkbox" id="menu-toggle">
    <label class="menu-boton" for="menu-toggle" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="notebooks.html">Notebooks</a></li>
        <li><a href="perifericos.html">Periféricos</a></li>
        <li><a href="audio.html">Audio</a></li>
        <li><a href="componentes.html">Componentes</a></li>
      </ul>
    </nav>

    <div class="acciones">
      <a href="login.html">Ingresar</a>
      <button class="btn-logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido -->
  <main>
    <section class="caja-form">
      <p class="form-eyebrow">Cuenta</p>
      <h1>Crear cuenta</h1>
      <p class="form-bajada">Completá tus datos y empezá a comprar en Nodo.</p>

      <form action="index.html" method="get">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Pablo" required>
        </div>

        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Figueroa" required>
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="campo">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento" required>
        </div>

        <button class="btn-enviar" type="submit">Registrarme</button>
      </form>

      <p class="pie-form">
        ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
      </p>
    </section>
  </main>

  <footer>
    <p>Nodo &copy; 2026</p>
  </footer>

</body>
</html>
