<body>

  <!-- Navbar -->
  <header class="navbar">
    <a class="marca" href="index.html">
      <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <path d="M16 16 5 7M16 16l11-9M16 16 5 25M16 16l11 9" stroke="currentColor" stroke-width="1.6" opacity=".55" fill="none"/>
        <circle cx="5" cy="7" r="3" fill="currentColor" opacity=".55"/>
        <circle cx="27" cy="7" r="3" fill="currentColor" opacity=".55"/>
        <circle cx="5" cy="25" r="3" fill="currentColor" opacity=".55"/>
        <circle cx="27" cy="25" r="3" fill="currentColor" opacity=".55"/>
        <circle cx="16" cy="16" r="5" fill="currentColor"/>
      </svg>
      Nodo
    </a>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="notebooks.html">Notebooks</a></li>
        <li><a href="perifericos.html">Periféricos</a></li>
        <li><a href="audio.html">Audio</a></li>
        <li><a href="componentes.html">Componentes</a></li>
      </ul>
    </nav>

    <div class="acciones">
      <a href="login.html">Ingresar</a>
      <button class="btn-logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenido -->
  <main>
    <section class="caja-form">
      <h1>Crear cuenta</h1>

      <form action="index.html" method="get">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Pablo" required>
        </div>

        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Figueroa" required>
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="campo">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento" required>
        </div>

        <button class="btn-enviar" type="submit">Registrarme</button>
      </form>

      <p class="pie-form">
        ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
      </p>
    </section>
  </main>

  <footer>
    <p>Nodo &copy; 2026 — Trabajo práctico, etapa 1.</p>
  </footer>

</body>
</html>
